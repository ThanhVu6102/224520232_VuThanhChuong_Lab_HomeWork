<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drum Kit Engine</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Drum Kit</h1>
    <div class="drum-pads">
        <!-- Hợp đồng dữ liệu: data-key và data-sound -->
        <button class="pad" data-key="a" data-sound="clap">A (Clap)</button>
        <button class="pad" data-key="s" data-sound="hihat">S (Hi-hat)</button>
        <button class="pad" data-key="d" data-sound="kick">D (Kick)</button>
        <button class="pad" data-key="f" data-sound="snare">F (Snare)</button>
    </div>
    <div class="controls">
        <button id="record-btn">Record</button>
        <button id="play-btn">Play</button>
    </div>
    <!-- Chưa nhúng JS ở bước này -->

    <script src="engine.js"></script>
    <script src="app.js"></script>
</body>
</html>
